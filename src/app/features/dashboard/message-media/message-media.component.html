@if (status() === 'downloaded' && !renderFailed()) {
  @switch (kind()) {
    @case ('image') {
      <button class="visual" type="button" (click)="open()">
        <img
          [src]="media()?.fileUrl || media()?.thumbnailUrl"
          [attr.width]="media()?.width"
          [attr.height]="media()?.height"
          alt="Imagen adjunta"
          loading="lazy"
          (load)="onLoad()"
          (error)="onError()"
        />
      </button>
    }
    @case ('sticker') {
      <button class="visual sticker" type="button" (click)="open()">
        <img
          [src]="media()?.fileUrl || media()?.thumbnailUrl"
          alt="Sticker"
          loading="lazy"
          (load)="onLoad()"
          (error)="onError()"
        />
      </button>
    }
    @case ('video') {
      <video
        controls
        preload="metadata"
        [src]="media()?.fileUrl"
        (loadedmetadata)="onLoad()"
        (error)="onError()"
      ></video>
    }
    @case ('audio') {
      <!-- El reproductor del producto, no el del navegador: los controles
           nativos cambian de forma en cada navegador y no siguen el tema. -->
      <app-audio-player [url]="media()?.fileUrl" [estado]="estadoDeMedia()" />
    }
    @case ('document') {
      <app-document-card
        [nombre]="media()?.filename || ('media.document' | t)"
        [url]="media()?.fileUrl"
        [bytes]="media()?.size"
        [estado]="estadoDeMedia()"
      />
    }
  }
} @else {
  <div class="media-state" [class.pending]="status() === 'pending' || status() === 'downloading'">
    <span>{{ stateLabel() }}</span>
    @if (canRetry()) {
      <button type="button" (click)="retry()" [disabled]="retrying()">
        {{ status() === 'failed' || renderFailed() ? 'Reintentar' : 'Intentar descargar' }}
      </button>
    }
  </div>
}
